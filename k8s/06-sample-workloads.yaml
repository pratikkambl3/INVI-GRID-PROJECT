apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-sample-app
  namespace: dev
  labels:
    app: dev-sample-app
    env: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dev-sample-app
  template:
    metadata:
      labels:
        app: dev-sample-app
    spec:
      containers:
        - name: nginx
          image: public.ecr.aws/nginx/nginx:alpine
          ports:
            - containerPort: 80
---
